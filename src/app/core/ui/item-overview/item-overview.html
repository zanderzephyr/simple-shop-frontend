<div class="item-overview-cover">
	<app-image-renderer [valueInput]="urlImageRendererConfiguration"></app-image-renderer>
</div>

<div class="item-overview-title">{{ data().getItem().getTitle() }}</div>

<div class="item-overview-price-and-discount">
	@if (discountedPrice() === undefined) {
		{{ price() }} EUR
	} @else {
		{{ discountedPrice() }} EUR -({{ discountInPercent() }}%)
	}
</div>
