<div class="carousel-container"
	 [class.horizontal]="scrollHorizontally()"
	 [class.vertical]="!scrollHorizontally()">

	@if (scrollButtonsVisible()) {
		@if (scrollHorizontally()) {
			<button class="carousel-left" matFab
					(mousedown)="startScrolling(ScrollDirection.BACKWARD)"
					(mouseenter)="onMouseEnter(ScrollDirection.BACKWARD)"
					(mouseleave)="onMouseLeave()">
				<mat-icon>arrow_left</mat-icon>
			</button>
		} @else {
			<button class="carousel-up" matFab
					(mousedown)="startScrolling(ScrollDirection.BACKWARD)"
					(mouseenter)="onMouseEnter(ScrollDirection.BACKWARD)"
					(mouseleave)="onMouseLeave()">
				<mat-icon>arrow_drop_up</mat-icon>
			</button>
		}
	}


	<div class="carousel-content" #carouselContent>
		<ng-content></ng-content>
	</div>

	@if (scrollButtonsVisible()) {
		@if (scrollHorizontally()) {
			<button class="carousel-right" matFab
					(mousedown)="startScrolling(ScrollDirection.FORWARD)"
					(mouseenter)="onMouseEnter(ScrollDirection.FORWARD)"
					(mouseleave)="onMouseLeave()">
				<mat-icon>arrow_right</mat-icon>
			</button>
		} @else {
			<button class="carousel-down" matFab
					(mousedown)="startScrolling(ScrollDirection.FORWARD)"
					(mouseenter)="onMouseEnter(ScrollDirection.FORWARD)"
					(mouseleave)="onMouseLeave()">
				<mat-icon>arrow_drop_down</mat-icon>
			</button>
		}
	}

</div>
