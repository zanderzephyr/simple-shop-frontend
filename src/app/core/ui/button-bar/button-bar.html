<div class="button-bar-container" [style.flex-direction]="config().getFlexDirection()().css">
	@for (buttonConfig of config().getButtonConfigurations()(); track buttonConfig.getText()) {
		<button
			matButton="outlined"
			(click)="buttonConfig.getActionCallback()()()"
			[disabled]="!buttonConfig.getEnabled()()"
		>
			{{ buttonConfig.getText()() }}
		</button>
	}
</div>
