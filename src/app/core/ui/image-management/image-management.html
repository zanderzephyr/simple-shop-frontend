@if (imageUrl(); as url) {
	<img class="image" [ngSrc]="url" fill alt="">
} @else {
	<button type="button" class="placeholder-container" (click)="onSetImage()">
		<mat-icon class="placeholder-icon">add_photo_alternate</mat-icon>
		<span class="placeholder-label">{{ uploadImageText() }}</span>
	</button>
}
