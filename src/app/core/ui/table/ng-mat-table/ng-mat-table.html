<div class="ng-mat-table-container">
  <!--
		This content is a bit complicated. Analyze
		https://v12.material.angular.io/components/table/overview
		in detail to understand better.

		dataSource: Tells Angular where to get the table data, i.e. the rows. 
	 	We can pass pretty much anything in here and just have to adapt accordingly
		in how we use it.
	-->
  <table mat-table [dataSource]="tableRowIds()" class="ng-mat-table">
    @for (tableColumn of tableColumns(); track tableColumn.getModelIndex()) {
      <!-- matColumnDef: Creates an injection slot for a column. -->
      <ng-container [matColumnDef]="tableColumn.getModelIndex() + ''">
        <!-- 
					*matHeaderCellDef: Creates an injection slot for the column header.
					The tag content is what's injected.
				-->
        <th mat-header-cell *matHeaderCellDef>{{ tableColumn.getTitle()() }}</th>
        <!--
					*matCellDef: Creates an injection slot for a column data cell; this
					is done for each row. The tag content is what's injected.
				-->
        <td mat-cell *matCellDef="let row">
          {{ table().getValueAt($index, row)() }}
        </td>
      </ng-container>
    }

    <!--
			Performs the actual injection into the previously created injection slots for the header.
			Done for each column.
		-->
    <tr mat-header-row *matHeaderRowDef="tableColumnIds()"></tr>

    <!--
			Spawns a table row container (<tr>) for every item provided by the dataSource.
			For each row, it loops through the specified column IDs to extract and inject 
			the matching data cell templates, passing the current item context down as 'row'.
    -->
    <tr mat-row *matRowDef="let row; columns: tableColumnIds()"></tr>
  </table>
</div>
