<p class="header">Filters</p>
<mat-form-field appearance="fill">
  <mat-label>Choose Media Type</mat-label>
  <mat-select [value]="selectedMediaType()" (selectionChange)="selectedMediaType.set($event.value)">
    @for (mediaType of mediaTypes(); track mediaType.id) {
      <mat-option [value]="mediaType.id">{{ mediaType.name }}</mat-option>
    }
    <mat-option [value]="getAllMediaTypesValue()">All types</mat-option>
  </mat-select>
</mat-form-field>

<p class="header">Price</p>
