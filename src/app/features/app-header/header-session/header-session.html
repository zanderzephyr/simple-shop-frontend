<div class="header-session-container">
  <button class="header-session-shopping-cart" mat-icon-button (click)="onShoppingCartClick()">
    <mat-icon>shopping_cart</mat-icon>
  </button>

  <button class="header-session-settings" mat-icon-button (click)="onSettingsClick()">
    <mat-icon>settings</mat-icon>
  </button>

  @if (isLoggedIn()) {
    <button class="header-session-menu-button" mat-flat-button [matMenuTriggerFor]="sessionMenu">
      Session
    </button>
    <mat-menu #sessionMenu="matMenu">
      <button
        class="header-session-menu-user-transactions"
        mat-menu-item
        (click)="onUserTransactionsClick()"
      >
        <span>Transactions</span>
      </button>

      <button class="header-session-menu-profile" mat-menu-item (click)="onProfileClick()">
        <span>Profile</span>
      </button>

      @if (isAdmin()) {
        <mat-divider></mat-divider>
        <div class="header-session-menu-admin-actions">Admin actions</div>

        <button
          class="header-session-menu-global-transactions"
          mat-menu-item
          (click)="onGlobalTransactionsClick()"
        >
          <span>Global transactions</span>
        </button>

        <button
          class="header-session-menu-book-keeping"
          mat-menu-item
          (click)="onBookKeepingClick()"
        >
          <span>Book keeping</span>
        </button>

        <button class="header-session-menu-inventory" mat-menu-item (click)="onInventoryClick()">
          <span>Inventory</span>
        </button>

        <button
          class="header-session-menu-user-management"
          mat-menu-item
          (click)="onUserManagementClick()"
        >
          <span>User management</span>
        </button>
      }

      <mat-divider></mat-divider>
      <button class="header-session-menu-logout" mat-menu-item (click)="onLogoutClick()">
        <span>Logout</span>
      </button>
    </mat-menu>
  } @else {
    <button class="header-session-login" mat-flat-button (click)="onLoginClick()">Login</button>
  }
</div>
