<div class="header-session-container">
  <button
    class="header-session-shopping-cart"
    mat-icon-button
    aria-label="Shopping Cart"
    (click)="onShoppingCartClick()"
  >
    <mat-icon>shopping_cart</mat-icon>
  </button>

  @if (isLoggedIn()) {
    <button class="header-session-menu-button" mat-flat-button [matMenuTriggerFor]="sessionMenu">
      Session
    </button>
    <mat-menu #sessionMenu="matMenu">
      <button
        class="header-session-menu-transactions"
        mat-menu-item
        (click)="onTransactionsClick()"
      >
        <span>Transactions</span>
      </button>

      <button class="header-session-menu-profile" mat-menu-item (click)="onProfileClick()">
        <span>Profile</span>
      </button>

      <button class="header-session-menu-logout" mat-menu-item (click)="onLogoutClick()">
        <span>Logout</span>
      </button>
    </mat-menu>
  } @else {
    <button class="header-session-login" mat-flat-button (click)="onLoginClick()">Login</button>
  }
</div>
