<p class="header">Price</p>

<!-- Take care: The order of the HTML elements is the focus order. -->
<div class="slider-container">
  <mat-form-field class="min-input" appearance="outline">
    <mat-label>Min ($)</mat-label>
    <input
      matInput
      type="number"
      [min]="minLimit"
      [max]="maxPrice()"
      [value]="minPrice()"
      (input)="minPrice.set($any($event.target).value ? +$any($event.target).value : minLimit)"
    />
  </mat-form-field>

  <mat-slider class="slider" [min]="minLimit" [max]="maxLimit" step="1" discrete>
    <input
      matSliderStartThumb
      [value]="minPrice()"
      (change)="minPrice.set($any($event.target).value)"
    />

    <input
      matSliderEndThumb
      [value]="maxPrice()"
      (change)="maxPrice.set($any($event.target).value)"
    />
  </mat-slider>

  <mat-form-field class="max-input" appearance="outline">
    <mat-label>Max ($)</mat-label>
    <input
      matInput
      type="number"
      [min]="minPrice()"
      [max]="maxLimit"
      [value]="maxPrice()"
      (input)="maxPrice.set($any($event.target).value ? +$any($event.target).value : maxLimit)"
    />
  </mat-form-field>
</div>
