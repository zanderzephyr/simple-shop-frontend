<div class="landing-special-discounts-container">
	<div class="landing-special-discounts-title">
		{{ specialDiscountsTitleText() }}
	</div>

	<app-carousel class="special-discounts-carousel">
		<div class="landing-special-discounts-items">
			@for (itemData of specialItemDiscountData(); track itemData.getItem().getId()) {
				<app-item-overview
					[data]="itemData">
				</app-item-overview>
			}
		</div>
	</app-carousel>
</div>
