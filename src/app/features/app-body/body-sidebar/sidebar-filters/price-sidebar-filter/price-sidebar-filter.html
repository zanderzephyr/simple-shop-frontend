<!-- Take care: The order of the HTML elements is the focus order. -->
<div class="price-sidebar-filter-title">{{ filterTitleText() }}</div>

<div class="price-filter">
	<mat-form-field class="min-input" appearance="outline">
		<mat-label>{{ minValueLabelText() }}</mat-label>
		<!--
		  matInput: Directive to apply Material Design styles and behavior to an input element
		-->
		<input
			matInput
			type="number"
			[min]="minLimit"
			[max]="maxPrice()"
			[value]="minPrice()"
			(input)="updateMinPrice($event)"
		/>
	</mat-form-field>

	<!-- TODO This slider should use cents as unit and the text fields should display the values in euros -->
	<mat-slider class="slider" [min]="minLimit" [max]="maxLimit" step="1" discrete>
		<!--
		  matSliderStartThumb: Directive for the slider to know, this is the start thumb

		  $event is the change event generated by the browser. Its target is the HTML
		   element that triggered the event, i.e. the input element.

		  (change) is triggered, when the slider is let go of and (input) triggers on every change.
		-->
		<input matSliderStartThumb [value]="minPrice()" (input)="updateMinPrice($event)" />

		<!-- matSliderEndThumb: Directive for the slider to know, this is the end thumb -->
		<input matSliderEndThumb [value]="maxPrice()" (input)="updateMaxPrice($event)" />
	</mat-slider>

	<mat-form-field class="max-input" appearance="outline">
		<mat-label>{{ maxValueLabelText() }}</mat-label>
		<input
			matInput
			type="number"
			[min]="minPrice()"
			[max]="maxLimit"
			[value]="maxPrice()"
			(input)="updateMaxPrice($event)"
		/>
	</mat-form-field>
</div>
