<div class="user-management-container">
  <div class="user-management-container-header">
    <mat-paginator
      class="user-management-container-paginator"
      [length]="totalUsers()"
      [pageSize]="pageSize()"
      [pageIndex]="pageIndex()"
      [pageSizeOptions]="[10, 20, 50, 100]"
      (page)="onPageChange($event)"
    >
    </mat-paginator>

    <div class="user-management-container-header-buttons">
      <button
        class="user-management-container-refresh-button"
        mat-stroked-button
        (click)="refresh()"
      >
        <mat-icon>refresh</mat-icon>
        <span>{{ refreshText() }}</span>
      </button>

      <button class="user-management-container-add-button" mat-stroked-button (click)="add()">
        <mat-icon>add</mat-icon>
        <span>{{ createUserText() }}</span>
      </button>
    </div>
  </div>

  <app-ng-mat-table class="user-management-container-table" [table]="table"> </app-ng-mat-table>
</div>
