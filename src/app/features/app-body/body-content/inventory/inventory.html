<div class="inventory-container-header">
  <mat-paginator
    class="inventory-container-paginator"
    [length]="totalItems()"
    [pageSize]="pageSize()"
    [pageIndex]="pageIndex()"
    [pageSizeOptions]="[10, 20, 50, 100]"
    (page)="onPageChange($event)"
  >
  </mat-paginator>

  <div class="inventory-container-header-buttons">
    <button class="inventory-container-refresh-button" matButton="outlined" (click)="refresh()">
      <mat-icon>refresh</mat-icon>
      <span>{{ refreshText() }}</span>
    </button>

    <button class="inventory-container-add-button" matButton="outlined" (click)="add()">
      <mat-icon>add</mat-icon>
      <span>{{ createItemText() }}</span>
    </button>
  </div>
</div>

<app-ng-mat-table class="inventory-container-table" [table]="table"></app-ng-mat-table>
