<div class="session-login-container">
  <mat-form-field class="session-login-username" appearance="outline">
    <mat-label>Username</mat-label>
    <input matInput type="text" [value]="username()" (input)="updateUsername($event)" />
  </mat-form-field>

  <mat-form-field class="session-login-password" appearance="outline">
    <mat-label>Password</mat-label>
    <input matInput type="password" [value]="password()" (input)="updatePassword($event)" />
  </mat-form-field>

  <button mat-button (click)="discard()">Discard</button>
  <button mat-button (click)="login()">Login</button>
</div>
