<form
  class="session-login-container"
  [formGroup]="loginForm"
  #formDirective="ngForm"
  (ngSubmit)="login()"
>
  <mat-form-field class="session-login-username" appearance="outline">
    <mat-label>Username</mat-label>
    <input matInput type="text" formControlName="username" />

    @if (
      loginForm.get('username')?.invalid && (loginForm.get('username')?.touched || isSubmitted)
    ) {
      <mat-error>Username must not be empty!</mat-error>
    }
  </mat-form-field>

  <mat-form-field class="session-login-password" appearance="outline">
    <mat-label>Password</mat-label>
    <input matInput type="password" formControlName="password" />

    @if (
      loginForm.get('password')?.invalid && (loginForm.get('password')?.touched || isSubmitted)
    ) {
      <mat-error>Password must not be empty!</mat-error>
    }
  </mat-form-field>

  <button
    class="session-login-discard"
    type="button"
    mat-stroked-button
    (click)="discard(formDirective)"
  >
    Discard
  </button>

  <button class="session-login-login" type="submit" mat-flat-button>Login</button>
</form>
