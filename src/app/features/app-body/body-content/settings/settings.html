<div class="settings-title">{{ settingsHeaderText() }}</div>

<div class="general-ui-settings-container">
  <mat-form-field class="settings-localization-form-field" appearance="outline" subscriptSizing="dynamic">
    <mat-label>{{ chooseLocalizationText() }}</mat-label>
    <mat-select
      [value]="localizationService.getLocalization()()"
      (selectionChange)="updateSelectedLocalization($event.value)"
    >
      @for (option of localizedLocalizations(); track option.object.id) {
        <mat-option [value]="option.object">{{ option.localizedLabel }}</mat-option>
      }
    </mat-select>
  </mat-form-field>

  <mat-form-field class="settings-theme-form-field" appearance="outline" subscriptSizing="dynamic">
    <mat-label>{{ chooseThemeText() }}</mat-label>
    <mat-select
      [value]="themeService.getTheme()()"
      (selectionChange)="updateSelectedTheme($event.value)"
    >
      @for (option of localizedThemes(); track option.object.id) {
        <mat-option [value]="option.object">{{ option.localizedLabel }}</mat-option>
      }
    </mat-select>
  </mat-form-field>
</div>
