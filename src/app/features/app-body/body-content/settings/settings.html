<div class="settings-container">
  <span class="settings-header">{{ settingsHeaderText() }}</span>

  <div class="general-ui-settings-container">
    <mat-form-field class="settings-localization-form-field" appearance="outline">
      <mat-label>{{ chooseLocalizationText() }}</mat-label>
      <mat-select
        [value]="localizationService.getLocalization()().id"
        (selectionChange)="updateSelectedLocalization($event.value)"
      >
        @for (option of localizedLocalizationOptions(); track option.object.id) {
          <mat-option [value]="option.object.id">{{ option.localizedLabel }}</mat-option>
        }
      </mat-select>
    </mat-form-field>

    <mat-form-field class="settings-theme-form-field" appearance="outline">
      <mat-label>{{ chooseThemeText() }}</mat-label>
      <mat-select
        [value]="themeService.getTheme()().id"
        (selectionChange)="updateSelectedTheme($event.value)"
      >
        @for (option of localizedThemeOptions(); track option.object.id) {
          <mat-option [value]="option.object.id">{{ option.localizedLabel }}</mat-option>
        }
      </mat-select>
    </mat-form-field>
  </div>
</div>
